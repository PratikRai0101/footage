    <script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Product Engineer (Mobile)","description":"<h2>About</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">We're building the future of storytelling and video editing.</p></li><li><p style=\"min-height:1.5em\">We're a small team that moves fast and builds things we're proud of.</p></li><li><p style=\"min-height:1.5em\">We care obsessively about taste: in design, in product, in every detail.</p></li><li><p style=\"min-height:1.5em\">We're solving <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.cardboard.ai/hard-problems\">these</a> hard problems.</p></li><li><p style=\"min-height:1.5em\">We're backed by a Tier-1 global fund, YC, and founders of billion dollar companies.</p></li></ul><h2>Engineering</h2><p style=\"min-height:1.5em\">Cardboard is a video editor you can talk to. It runs in the browser and as a Mac app. Most footage is shot on phones, and we don't have a mobile app yet.</p><p style=\"min-height:1.5em\">We're hiring a Product Engineer (Mobile) to build v1 from scratch, and to decide what Cardboard on a phone should be. We care more about taste and craft than any one stack. With agents, keeping iOS and Android in step is the easy part. Making something people love using is the hard part.</p><h2>What you'll own</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Cardboard on iOS and Android, from architecture to the app stores.</p></li><li><p style=\"min-height:1.5em\">Handling real phone footage: 4K, HDR, and huge files.</p></li><li><p style=\"min-height:1.5em\">Uploads that survive bad networks and the app going to the background.</p></li></ul><h2>Who you are</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You've shipped mobile apps people use every day, and you sweat how they feel.</p></li><li><p style=\"min-height:1.5em\">You're a strong mobile engineer, whether that's Swift, Kotlin, or React Native.</p></li><li><p style=\"min-height:1.5em\">You notice when an interaction feels off, and you fix it.</p></li><li><p style=\"min-height:1.5em\">Bonus: you've built a camera, photo, or video app.</p></li></ul><h2>How we work</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You own outcomes, not tickets: decide what to build, ship it, and check it worked.</p></li><li><p style=\"min-height:1.5em\">You talk to users and look at the data.</p></li><li><p style=\"min-height:1.5em\">You build with AI agents every day, and you're the taste and judgment in the loop.</p></li></ul><h2>What you get</h2><p style=\"min-height:1.5em\">You'd be surrounded by people who are absurdly good at what they do. One started coding at 11 and shipped an app with 6M+ downloads in high school. One got into CS engineering at 14 and has been working on distributed systems for 8+ years. One's an ex-founder who took a company to 1.2M users and $300M+ in transactions. That's the team. We're looking for someone who'll raise the bar on technical craftsmanship and product quality. Apart from that you'd get:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Competitive salary and founding-team equity.</p></li><li><p style=\"min-height:1.5em\">Unlimited tokens across every AI model. Use whatever you want, as much as you want.</p></li><li><p style=\"min-height:1.5em\">A healthy budget for AI tools and any peripherals you need to do your best work.</p></li></ul>","directApply":false,"identifier":{"@type":"PropertyValue","name":"Cardboard, Inc","value":"a18a5b6c-8b4a-4418-be14-55235744313f"},"datePosted":"2026-10-03","hiringOrganization":{"@type":"Organization","name":"Cardboard, Inc","sameAs":"https://cardboard.ai","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/e6d07a8a-5e65-4188-b212-f6e39cf65db6/27ecc619-5c01-4176-a8f0-4e15d09f7e4b/8f86928e-c1e6-44da-b344-2c14f13a6494.png"},"jobLocation":{"@type":"Place","address":{"@type":"Postal
