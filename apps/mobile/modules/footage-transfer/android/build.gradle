plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.footagetransfer'
version = '0.1.0'

android {
  namespace "expo.modules.footagetransfer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lint {
    abortOnError true
  }
}

dependencies {
  implementation 'io.tus.java.client:tus-java-client:0.5.1'
  testImplementation 'junit:junit:4.13.2'
}

